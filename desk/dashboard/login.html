<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Mocertii Capital</title>
<style>
  :root { color-scheme: dark; --bg: #070a10; --card: #0e131c; --line: rgba(255,255,255,.07); --text: #eef0f4; --muted: #8a93a3; --gold: #d6a84e; --red: #ef6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(1200px 600px at 20% -10%, #141b29 0%, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: min(380px, 92vw); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo { width: 38px; height: 38px; border-radius: 9px; border: 1px solid rgba(214,168,78,.45); display: grid; place-items: center; background: #16120a; }
  .name { color: var(--gold); font-weight: 700; letter-spacing: .14em; font-size: 13px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0a0e15; color: var(--text); font: inherit; }
  input:focus { outline: 2px solid rgba(214,168,78,.5); outline-offset: 1px; }
  button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 10px; background: var(--gold); color: #17120a; font-weight: 700; font-size: 14px; cursor: pointer; }
  .err { margin-top: 14px; color: var(--red); font-size: 13px; display: none; }
  .foot { margin-top: 18px; color: var(--muted); font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="on">
    <div class="brand">
      <div class="logo"><svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><path d="M2 16V2l9 9 9-9v14" fill="none" stroke="#d6a84e" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
      <div><div class="name">MOCERTII CAPITAL</div><div class="sub">MemeScout desk · paper trading</div></div>
    </div>
    <label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="foot">Read-only. Nothing here can place an order or move funds.</div>
  </form>
  <script>
    const e = new URLSearchParams(location.search).get('e');
    if (e) { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = e === 'locked' ? 'Too many attempts. Wait 15 minutes and try again.' : 'Wrong username or password.'; }
  </script>
</body>
</html>
